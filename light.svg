<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient matching GitHub Light -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="200" rx="12" fill="url(#bgLight)" stroke="#d0d7de" stroke-width="1.5" filter="url(#shadowLight)"/>

  <!-- Left Side: Terminal / Code Window -->
  <g transform="translate(30, 25)">
    <!-- Terminal Header Bar -->
    <rect width="360" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="18" cy="18" r="4" fill="#cf222e"/>
    <circle cx="32" cy="18" r="4" fill="#9a6700"/>
    <circle cx="46" cy="18" r="4" fill="#1a7f37"/>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#d0d7de" stroke-width="1"/>

    <!-- Code Typing Simulation -->
    <g font-family="Consolas, Fira Code, monospace" font-size="12">
      <!-- Line 1 -->
      <text x="18" y="55" fill="#1f2328">
        <tspan fill="#cf222e">class</tspan> <tspan fill="#8250df">SoftwareEngineer</tspan>:
      </text>

      <!-- Line 2 -->
      <text x="32" y="78" fill="#1f2328">
        <tspan fill="#0550ae">self</tspan>.stack = [<tspan fill="#0a3069">"Python"</tspan>, <tspan fill="#0a3069">"DSA"</tspan>, <tspan fill="#0a3069">"Logic"</tspan>]
      </text>

      <!-- Line 3 -->
      <text x="32" y="101" fill="#1f2328">
        <tspan fill="#cf222e">def</tspan> <tspan fill="#8250df">solve_problem</tspan>(<tspan fill="#0550ae">self</tspan>):
      </text>

      <!-- Line 4 with Cursor -->
      <text x="46" y="124" fill="#1a7f37">
        <tspan fill="#cf222e">return</tspan> <tspan fill="#0a3069">"Optimal Solution O(1)"</tspan>
      </text>

      <!-- Blinking Cursor -->
      <rect x="252" y="113" width="7" height="13" fill="#0969da">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Right Side: Algorithmic Node Mesh & Analytics -->
  <g transform="translate(430, 25)">
    <!-- Node Network Lines -->
    <g stroke="#d0d7de" stroke-width="1.5">
      <line x1="60" y1="40" x2="160" y2="30"/>
      <line x1="160" y1="30" x2="260" y2="70"/>
      <line x1="60" y1="40" x2="110" y2="100"/>
      <line x1="110" y1="100" x2="210" y2="110"/>
      <line x1="260" y1="70" x2="210" y2="110"/>
      <line x1="160" y1="30" x2="210" y2="110"/>
    </g>

    <!-- Pulsing Data Signals along edges -->
    <circle cx="60" cy="40" r="3" fill="#0969da">
      <animateMotion path="M0,0 L100,-10 L200,30" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="3" fill="#1a7f37">
      <animateMotion path="M0,0 L50,60 L150,70" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Graph Nodes -->
    <circle cx="60" cy="40" r="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <circle cx="160" cy="30" r="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2">
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="70" r="6" fill="#fcf0ff" stroke="#8250df" stroke-width="2"/>
    <circle cx="110" cy="100" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <circle cx="210" cy="110" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>

    <!-- Bottom Status Bar -->
    <g transform="translate(10, 132)">
      <text x="0" y="0" font-family="Consolas, monospace" font-size="11" fill="#57606a">
        ALGORITHMIC EFFICIENCY: <tspan fill="#1a7f37" font-weight="bold">HIGH</tspan>
      </text>
      <!-- Activity pulse dots -->
      <g transform="translate(220, -8)">
        <rect x="0" y="0" width="8" height="8" rx="2" fill="#ebedf0">
          <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="2s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <rect x="12" y="0" width="8" height="8" rx="2" fill="#ebedf0">
          <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="24" y="0" width="8" height="8" rx="2" fill="#ebedf0">
          <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="36" y="0" width="8" height="8" rx="2" fill="#ebedf0">
          <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
