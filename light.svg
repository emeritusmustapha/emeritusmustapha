<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGradLight" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f6fc"/>
      <animate attributeName="cx" values="50%;55%;45%;50%" dur="8s" repeatCount="indefinite"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradLight)"/>

  <!-- Sun rays -->
  <g transform="translate(70, 70)">
    <line x1="0" y1="-35" x2="0" y2="-45" stroke="#d0d7de" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="25" y1="-25" x2="32" y2="-32" stroke="#d0d7de" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="0" x2="45" y2="0" stroke="#d0d7de" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="25" y1="25" x2="32" y2="32" stroke="#d0d7de" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="35" x2="0" y2="45" stroke="#d0d7de" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="-25" y1="25" x2="-32" y2="32" stroke="#d0d7de" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Sun -->
  <g filter="url(#shadow)">
    <circle cx="70" cy="70" r="25" fill="#218bff">
      <animate attributeName="r" values="25;28;25" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Clouds -->
  <g opacity="0.4">
    <ellipse cx="120" cy="100" rx="30" ry="12" fill="#d0d7de">
      <animateTransform attributeName="transform" type="translate" values="0,0;10,0;0,0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="135" cy="95" rx="20" ry="10" fill="#e6edf3">
      <animateTransform attributeName="transform" type="translate" values="0,0;10,0;0,0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Code blocks -->
  <g filter="url(#shadow)">
    <rect x="240" y="60" width="100" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2">
      <animate attributeName="y" values="60;55;60" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="75" width="40" height="6" rx="3" fill="#0969da" opacity="0.6"/>
    <rect x="295" y="75" width="25" height="6" rx="3" fill="#8250df" opacity="0.6"/>
    <rect x="250" y="88" width="60" height="6" rx="3" fill="#1a7f37" opacity="0.6"/>
    <rect x="250" y="101" width="35" height="6" rx="3" fill="#cf222e" opacity="0.6"/>
  </g>

  <!-- Git branch animation -->
  <g transform="translate(280, 220)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="6" fill="#0969da">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="-20" r="6" fill="#1a7f37">
      <animate attributeName="r" values="6;8;6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="20" r="6" fill="#cf222e">
      <animate attributeName="r" values="6;8;6" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,0 L30,-20" stroke="#d0d7de" stroke-width="2" fill="none"/>
    <path d="M0,0 L30,20" stroke="#d0d7de" stroke-width="2" fill="none"/>
  </g>

  <!-- Contribution graph animation -->
  <g transform="translate(60, 300)" opacity="0.9">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="0" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="0" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="0" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#40c463;#ebedf0" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="14" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#30a14e;#ebedf0" dur="1.5s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#30a14e;#ebedf0" dur="1.5s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="14" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#30a14e;#ebedf0" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="14" width="10" height="10" rx="2" fill="#ebedf0">
      <animate attributeName="fill" values="#ebedf0;#30a14e;#ebedf0" dur="1.5s" begin="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center GitHub-style logo -->
  <g transform="translate(200, 180)" filter="url(#shadow)">
    <path d="M-30,-10 C-30,-25 -15,-30 0,-20 C15,-30 30,-25 30,-10 C30,15 0,30 0,30 C0,30 -30,15 -30,-10 Z" 
          fill="none" stroke="#0969da" stroke-width="3">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#d0d7de" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating tech icons -->
  <g opacity="0.5">
    <text x="50" y="230" font-family="monospace" font-size="14" fill="#0969da">
      git
      <animateTransform attributeName="transform" type="translate" values="0,0;5,-5;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="150" font-family="monospace" font-size="12" fill="#8250df">
      npm
      <animateTransform attributeName="transform" type="translate" values="0,0;-5,-3;0,0" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
