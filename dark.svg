<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
      <animate attributeName="cx" values="50%;60%;40%;50%" dur="8s" repeatCount="indefinite"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="60" r="2" fill="#58a6ff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="30" r="1.5" fill="#58a6ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="80" r="2" fill="#79c0ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="180" r="1.5" fill="#58a6ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="300" r="1.8" fill="#79c0ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Planet Orbit -->
  <ellipse cx="200" cy="200" rx="120" ry="120" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5,5" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Planet -->
  <g filter="url(#glow)">
    <circle cx="200" cy="80" r="25" fill="#58a6ff">
      <animate attributeName="r" values="25;28;25" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Planet ring -->
    <ellipse cx="200" cy="80" rx="38" ry="8" fill="none" stroke="#79c0ff" stroke-width="2" transform="rotate(-20 200 80)">
      <animateTransform attributeName="transform" type="rotate" values="-20 200 80;-20 200 80;20 200 80;-20 200 80" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Orbiting moon -->
  <circle cx="280" cy="160" r="6" fill="#e6edf3" opacity="0.9">
    <animateMotion dur="6s" repeatCount="indefinite" path="M200,80 C250,20 320,80 280,160 C240,240 160,180 200,80"/>
  </circle>

  <!-- Floating code brackets -->
  <g filter="url(#glow)">
    <text x="60" y="140" font-family="monospace" font-size="20" fill="#58a6ff" opacity="0.7">
      &lt;/&gt;
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="310" y="280" font-family="monospace" font-size="24" fill="#79c0ff" opacity="0.6">
      { }
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- GitHub contribution dots animation -->
  <g transform="translate(250, 300)" opacity="0.8">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#0e4429">
      <animate attributeName="fill" values="#0e4429;#39d353;#0e4429" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="0" width="8" height="8" rx="2" fill="#0e4429">
      <animate attributeName="fill" values="#0e4429;#39d353;#0e4429" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="0" width="8" height="8" rx="2" fill="#0e4429">
      <animate attributeName="fill" values="#0e4429;#39d353;#0e4429" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="0" width="8" height="8" rx="2" fill="#0e4429">
      <animate attributeName="fill" values="#0e4429;#39d353;#0e4429" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center GitHub Logo Animation -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <path d="M-24,-8 C-24,-20 -12,-24 0,-16 C12,-24 24,-20 24,-8 C24,8 0,24 0,24 C0,24 -24,8 -24,-8 Z" 
          fill="none" stroke="#58a6ff" stroke-width="3">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#30363d" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
